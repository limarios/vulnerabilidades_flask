name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check)
        # pyproject's [tool.mypy] limits `files` to the modules we type strictly
        # (blue_team, db, config); the deliberately-simple vulnerable/secure demo
        # modules are out of scope on purpose.
        run: mypy

      - name: Pytest (with coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  security-audit:
    name: Security audit (non-blocking)
    runs-on: ubuntu-latest
    # This job is informational. The lab INTENTIONALLY may ship dependencies (or
    # code) with known CVEs to demonstrate vulnerable behaviour, so a finding
    # here must NOT fail the build. Treat it as a report to read, not a gate.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pip-audit (dependency CVEs, non-blocking)
        continue-on-error: true
        run: pip-audit --desc

      # Static security analysis (bandit-style) is already enforced inside the
      # lint job: ruff runs the flake8-bandit ruleset via `select = ["S"]`
      # (see pyproject.toml), with S silenced only in the by-design vulnerable
      # modules. We surface it again here, non-blocking, for a focused report.
      - name: Ruff security ruleset (bandit/S, report only)
        continue-on-error: true
        run: ruff check --select S --output-format full .
